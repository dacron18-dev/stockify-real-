<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockify – learn trading with paper money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10192f;--muted:#5c6785;--bg:#eef1f7;--card:#fff;--line:#dde2ee;--brand:#3b4cca;--brand-ink:#fff;--gain:#0b8f63;--loss:#d6384a;--r:14px}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:0}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.logo{font-weight:800;font-size:1.5rem}.logo i{font-style:normal;color:var(--brand)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
header .who{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:.9rem}
.badge{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-weight:600;color:var(--ink)}
main{max-width:1120px;margin:28px auto;padding:0 20px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:620px){.stats{grid-template-columns:1fr}}
.stat small{color:var(--muted)}.stat b{display:block;font:700 1.9rem 'Bricolage Grotesque';margin-top:2px}
.gain{color:var(--gain)}.loss{color:var(--loss)}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.row{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.buy{background:var(--gain)}.btn.sell{background:var(--loss)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.quote{margin-top:16px;padding:14px;border-radius:10px;background:var(--bg)}
.quote .px{font:700 2rem 'Bricolage Grotesque'}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.wrap{overflow-x:auto}
.empty{color:var(--muted);padding:18px 0}
.auth{max-width:420px;margin:9vh auto;padding:0 20px}
.auth h1{font-size:2.4rem;line-height:1.1;margin:14px 0 6px}
.auth p{color:var(--muted);margin:0 0 18px}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--loss)}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const money = n => Number(n).toLocaleString('en-IN', {style:'currency', currency:'INR'});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode = 'login', quote = null, chartRange = '1mo', chartPts = [];

function toast(msg, bad){ const t=$('#toast'); t.textContent=msg; t.className='show'+(bad?' err':''); clearTimeout(toast.id); toast.id=setTimeout(()=>t.className='',3200); }

async function api(path, opts={}){
  const tok = localStorage.getItem('tok');
  const r = await fetch('/api'+path, {
    method: opts.method || 'GET',
    headers: {'Content-Type':'application/json', ...(tok?{Authorization:'Bearer '+tok}:{})},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ if(r.status===401 && tok) logout(true); throw new Error(j.error||'Something went wrong'); }
  return j;
}
function logout(silent){ clearInterval(window.poll); localStorage.clear(); quote=null; render(); if(silent!==true) toast('Logged out'); }

function header(){
  return `<header><div class="logo">Stock<i>ify</i></div>
  <div class="who"><span>${esc(localStorage.getItem('email'))}</span><span class="badge">${esc(localStorage.getItem('role'))}</span>
  <button class="btn ghost" onclick="logout()">Log out</button></div></header>`;
}

function render(){
  const role = localStorage.getItem('role');
  if(!localStorage.getItem('tok')) return authView();
  role === 'admin' ? adminView() : traderView();
}

function authView(){
  const login = mode==='login';
  $('#app').innerHTML = `<div class="auth"><div class="logo">Stock<i>ify</i></div>
  <h1>Practice trading. Risk nothing.</h1>
  <p>Start with ₹10,00,000 in paper money and trade real NSE/BSE stock prices.</p>
  <form class="card" id="authForm">
    <label for="em">Email</label><input id="em" type="email" required autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" minlength="6" required autocomplete="${login?'current-password':'new-password'}">
    <div style="margin-top:18px" class="row"><button class="btn" style="flex:1">${login?'Log in':'Create account'}</button></div>
    <p style="margin:16px 0 0">${login?'New here?':'Already have an account?'}
      <button type="button" class="link" id="swap">${login?'Create an account':'Log in'}</button></p>
  </form></div>`;
  $('#swap').onclick = () => { mode = login?'signup':'login'; authView(); };
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    try{
      const j = await api(login?'/login':'/signup', {method:'POST', body:{email:$('#em').value.trim(), password:$('#pw').value}});
      localStorage.setItem('tok', j.token); localStorage.setItem('role', j.role); localStorage.setItem('email', j.email);
      render();
    }catch(err){ toast(err.message, true); }
  };
}

async function traderView(){
  $('#app').innerHTML = header() + `<main>
    <section class="card stats" id="stats"></section>
    <div class="grid">
      <section class="card"><h2>Trade</h2>
        <form id="q" class="row" style="margin-top:12px"><input id="sym" list="nifty" placeholder="Indian stock, e.g. RELIANCE or TCS" aria-label="Ticker symbol" required><button class="btn">Get price</button></form>
        <datalist id="nifty"></datalist>
        <div id="quote"></div>
        <div id="chartBox" style="margin-top:16px"></div></section>
      <section class="card"><h2>Your holdings</h2><div class="wrap" id="hold"></div></section>
    </div>
    <section class="card"><h2>Nifty 50 stocks (NSE)</h2><div class="wrap" id="watch"><div class="empty">Loading prices...</div></div></section>
    <section class="card"><h2>Trade history</h2><div class="wrap" id="hist"></div></section>
    <section class="card"><h2>Alerts and notifications</h2><div id="notes"></div><div id="alerts" style="margin-top:14px"></div></section></main>`;
  $('#q').onsubmit = async e => { e.preventDefault(); await getQuote($('#sym').value); };
  await refresh();
  loadWatch();
  loadAlerts();
  clearInterval(window.poll); let n = 0;
  window.poll = setInterval(() => {                       // live updates every 10 seconds
    n++; updateQuote();
    if(n%2===0) refresh();                                // portfolio value (every 20s)
    if(n%3===0){ loadWatch(); loadAlerts(); }             // market table + alerts (every 30s)
    if(n%6===0 && quote && (chartRange==='1d'||chartRange==='5d')) loadChart(true);   // intraday chart (every 60s)
  }, 10000);
}

async function loadWatch(){
  try{ const w = await api('/watchlist');
    $('#nifty').innerHTML = w.map(q=>`<option value="${esc(q.symbol)}">${esc(q.name)}</option>`).join('');
    $('#watch').innerHTML = '<table><tr><th>Symbol</th><th>Company</th><th>Price</th><th>Change</th><th></th></tr>' + w.map(q=>{
      const ch = q.changePct, up = ch>=0;
      return `<tr><td><b>${esc(q.symbol.replace('.NS',''))}</b></td><td>${esc(q.name)}</td><td>${money(q.price)}</td>
      <td class="${up?'gain':'loss'}">${up?'+':''}${ch.toFixed(2)}%</td>
      <td><button type="button" class="btn ghost" onclick="getQuote('${esc(q.symbol)}');window.scrollTo({top:0,behavior:'smooth'})">Trade</button></td></tr>`;
    }).join('') + '</table>';
  }catch(e){}
}

async function getQuote(sym){
  try{ quote = await api('/quote?symbol='+encodeURIComponent(sym.trim())); drawQuote(); loadChart(); }
  catch(err){ quote=null; $('#quote').innerHTML=''; $('#chartBox').innerHTML=''; toast(err.message, true); }
}
async function updateQuote(){                              // refresh only the price, keep typed quantity / alert values
  if(!quote || !$('#qpx')) return;
  try{ const q = await api('/quote?symbol='+encodeURIComponent(quote.symbol));
    if(!quote || q.symbol!==quote.symbol) return;
    quote = q; const up = q.changePct >= 0;
    $('#qpx').innerHTML = '₹'+q.price.toFixed(2)+' <small>INR</small>';
    $('#qchg').className = up?'gain':'loss';
    $('#qchg').textContent = (up?'+':'')+q.changePct.toFixed(2)+'% today';
    $('#qtime').textContent = 'Updated '+new Date().toLocaleTimeString('en-IN');
  }catch(e){}
}
async function loadChart(silent){
  const box = $('#chartBox'); if(!box || !quote) return;
  const sym = quote.symbol;
  if(silent!==true) box.innerHTML = '<div class="empty">Loading chart...</div>';
  try{ const j = await api('/history?symbol='+encodeURIComponent(sym)+'&range='+chartRange);
    if(!quote || quote.symbol!==sym) return;
    chartPts = j.points; drawChart();
  }catch(e){ if(silent!==true) box.innerHTML = '<div class="empty">Chart not available for this stock right now.</div>'; }
}
function setRange(r){ chartRange = r; loadChart(); }
function drawChart(){
  const box = $('#chartBox'), pts = chartPts;
  if(!box || pts.length<2){ if(box) box.innerHTML = '<div class="empty">Not enough chart data yet.</div>'; return; }
  const W=600, H=230, L=6, R=6, T=12, B=24;
  const cs = pts.map(p=>p.c), min = Math.min(...cs), max = Math.max(...cs), span = (max-min) || 1;
  const x = i => L + i*(W-L-R)/(pts.length-1), y = v => T + (max-v)*(H-T-B)/span;
  const up = cs[cs.length-1] >= cs[0], col = up ? 'var(--gain)' : 'var(--loss)';
  const line = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.c).toFixed(1)).join(' ');
  const area = line+' L'+x(pts.length-1).toFixed(1)+' '+(H-B)+' L'+x(0).toFixed(1)+' '+(H-B)+' Z';
  const intraday = chartRange==='1d' || chartRange==='5d';
  const fmt = t => new Date(t*1000).toLocaleString('en-IN', {timeZone:'Asia/Kolkata', ...(intraday ? {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'} : {day:'numeric', month:'short', year:'2-digit'})});
  const chg = cs[cs.length-1]-cs[0], pct = chg/cs[0]*100;
  box.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
      <div class="row" style="gap:4px">${[['1d','1D'],['5d','5D'],['1mo','1M'],['6mo','6M'],['1y','1Y']].map(([k,l])=>
        `<button type="button" class="btn ghost" style="padding:5px 11px;${k===chartRange?'border-color:var(--brand);font-weight:700':''}" onclick="setRange('${k}')">${l}</button>`).join('')}</div>
      <span class="${up?'gain':'loss'}" style="font-weight:600">${up?'+':''}${chg.toFixed(2)} (${up?'+':''}${pct.toFixed(2)}%)</span></div>
    <div style="position:relative;margin-top:8px">
      <svg id="csvg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:none" role="img" aria-label="Price chart for ${esc(quote.symbol)}">
        <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#0b8f63':'#d6384a'}" stop-opacity=".25"/><stop offset="1" stop-color="${up?'#0b8f63':'#d6384a'}" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#cg)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
        <text x="${L}" y="${T+8}" font-size="11" fill="#5c6785">₹${max.toFixed(2)}</text>
        <text x="${L}" y="${H-B-4}" font-size="11" fill="#5c6785">₹${min.toFixed(2)}</text>
        <text x="${L}" y="${H-6}" font-size="11" fill="#5c6785">${fmt(pts[0].t)}</text>
        <text x="${W-R}" y="${H-6}" font-size="11" fill="#5c6785" text-anchor="end">${fmt(pts[pts.length-1].t)}</text>
        <line id="cl" y1="${T}" y2="${H-B}" stroke="#5c6785" stroke-dasharray="3" style="display:none"/><circle id="cc" r="4" fill="${col}" style="display:none"/>
      </svg><div id="ctip" style="position:absolute;top:0;left:0;pointer-events:none;display:none;background:var(--ink);color:#fff;padding:5px 9px;border-radius:8px;font-size:.8rem;white-space:nowrap"></div></div>`;
  const svg = $('#csvg'), tip = $('#ctip');
  const move = e => {
    const r = svg.getBoundingClientRect(), cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const i = Math.max(0, Math.min(pts.length-1, Math.round(((cx/r.width)*W - L)/(W-L-R)*(pts.length-1))));
    const p = pts[i], px = x(i), py = y(p.c);
    $('#cl').setAttribute('x1',px); $('#cl').setAttribute('x2',px); $('#cc').setAttribute('cx',px); $('#cc').setAttribute('cy',py);
    $('#cl').style.display = $('#cc').style.display = 'block';
    tip.style.display = 'block'; tip.innerHTML = '<b>'+money(p.c)+'</b><br>'+fmt(p.t);
    tip.style.left = Math.min(r.width - tip.offsetWidth, Math.max(0, px/W*r.width - tip.offsetWidth/2))+'px'; tip.style.top = '-4px';
  };
  const leave = () => { $('#cl').style.display = $('#cc').style.display = 'none'; tip.style.display = 'none'; };
  svg.addEventListener('mousemove', move); svg.addEventListener('touchmove', move); svg.addEventListener('mouseleave', leave); svg.addEventListener('touchend', leave);
}
function drawQuote(){
  const up = quote.changePct >= 0;
  $('#quote').innerHTML = `<div class="quote"><b>${esc(quote.symbol)}</b> <span style="color:var(--muted)">${esc(quote.name)}</span>
    <div class="px" id="qpx">₹${quote.price.toFixed(2)} <small>INR</small></div>
    <div id="qchg" class="${up?'gain':'loss'}">${up?'+':''}${quote.changePct.toFixed(2)}% today</div>
    <small id="qtime" style="color:var(--muted)">Live, updates every 10 seconds</small></div>
    <label for="qty">Quantity</label><input id="qty" type="number" min="1" value="1">
    <div class="row" style="margin-top:14px"><button class="btn buy" style="flex:1" onclick="trade('BUY')">Buy</button>
    <button class="btn sell" style="flex:1" onclick="trade('SELL')">Sell</button></div>
    <label for="alertPx">Price alert</label>
    <div class="row"><input id="alertPx" type="number" step="0.01" min="0" placeholder="Target price"><button class="btn ghost" onclick="setAlert()">Set alert</button></div>`;
}
async function setAlert(){
  try{ const j = await api('/alerts', {method:'POST', body:{symbol:quote.symbol, price:parseFloat($('#alertPx').value)}}); toast(j.message); loadAlerts(); }
  catch(err){ toast(err.message, true); }
}
async function loadAlerts(){
  if(!$('#notes')) return;
  try{
    const [n, a] = await Promise.all([api('/notifications'), api('/alerts')]);
    $('#notes').innerHTML = n.length ? n.map(x=>`<div class="row" style="justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><span style="${x.read?'color:var(--muted)':'font-weight:600'}">${esc(x.message)}</span>${x.read?'':`<button class="btn ghost" onclick="readNote(${x.id})">Mark read</button>`}</div>`).join('') : '<div class="empty">No notifications yet. Set a price alert from the trade panel.</div>';
    $('#alerts').innerHTML = a.length ? '<table><tr><th>Symbol</th><th>Target</th><th>Direction</th><th>Status</th></tr>'+a.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${Number(x.target).toFixed(2)}</td><td>${x.above?'rises to':'falls to'}</td><td>${x.triggered?'Triggered':'Waiting'}</td></tr>`).join('')+'</table>' : '';
  }catch(e){}
}
async function readNote(id){ try{ await api('/notifications/read', {method:'POST', body:{id}}); loadAlerts(); }catch(e){ toast(e.message, true); } }
async function trade(side){
  try{
    const j = await api('/trade', {method:'POST', body:{symbol:quote.symbol, side, qty:parseInt($('#qty').value,10)}});
    toast(j.message); await refresh();
  }catch(err){ toast(err.message, true); }
}
async function refresh(){
  try{
    const [p, t] = await Promise.all([api('/portfolio'), api('/trades')]);
    const pnl = p.equity - p.startCash;
    $('#stats').innerHTML = `<div class="stat"><small>Cash</small><b>${money(p.balance)}</b></div>
      <div class="stat"><small>Total value</small><b>${money(p.equity)}</b></div>
      <div class="stat"><small>Profit / loss</small><b class="${pnl>=0?'gain':'loss'}">${pnl>=0?'+':''}${money(pnl)}</b></div>`;
    $('#hold').innerHTML = p.holdings.length ? `<table><tr><th>Symbol</th><th>Qty</th><th>Avg cost</th><th>Price</th><th>P/L</th></tr>` +
      p.holdings.map(h=>`<tr><td><b>${esc(h.symbol)}</b></td><td>${h.qty}</td><td>${h.avgPrice.toFixed(2)}</td><td>${h.price.toFixed(2)}</td>
      <td class="${h.pnl>=0?'gain':'loss'}">${h.pnl>=0?'+':''}${h.pnl.toFixed(2)}</td></tr>`).join('') + '</table>'
      : '<div class="empty">No holdings yet. Search a ticker and place your first buy.</div>';
    $('#hist').innerHTML = t.length ? `<table><tr><th>Time</th><th>Side</th><th>Symbol</th><th>Qty</th><th>Price</th></tr>` +
      t.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td class="${x.side==='BUY'?'gain':'loss'}">${x.side}</td><td>${esc(x.symbol)}</td><td>${x.qty}</td><td>${Number(x.price).toFixed(2)}</td></tr>`).join('') + '</table>'
      : '<div class="empty">Your trades will show up here.</div>';
  }catch(err){ toast(err.message, true); }
}

async function adminView(){
  $('#app').innerHTML = header() + `<main>
    <section class="card" id="sys"></section>
    <section class="card"><h2>Market control</h2><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="marketEvent()">Trigger market event</button><button class="btn ghost" onclick="simToggle(true)">Start simulation</button><button class="btn ghost" onclick="simToggle(false)">Stop simulation</button></div><p class="empty" style="margin:8px 0 0">A market event moves one stock’s price for everyone and can trigger price alerts.</p></section>
    <section class="card"><h2>Users</h2><div class="wrap" id="users"></div></section>
    <section class="card"><h2>Recent trades (all users)</h2><div class="wrap" id="all"></div></section></main>`;
  try{
    const [u, t, st] = await Promise.all([api('/admin/users'), api('/admin/trades'), api('/admin/stats')]);
    $('#sys').innerHTML = `<h2>System</h2><div class="stats" style="margin-top:12px"><div class="stat"><small>Trades this session</small><b>${st.tradesThisSession}</b></div><div class="stat"><small>Audit records (binary file)</small><b>${st.auditRecords}</b></div><div class="stat"><small>Average trade value</small><b>${money(st.avgTradeValue)}</b></div><div class="stat"><small>Simulation</small><b>${st.simulationRunning?'Running':'Stopped'}</b></div></div><div class="empty">${st.recentLogs.length?st.recentLogs.map(esc).join('<br>'):'No log lines yet.'}</div>`;
    const mail = Object.fromEntries(u.map(x=>[x.id, x.email]));
    $('#users').innerHTML = `<table><tr><th>Email</th><th>Role</th><th>Cash</th><th></th></tr>` + u.map(x=>`<tr><td>${esc(x.email)}</td><td>${x.role}</td>
      <td>${money(x.balance)}</td><td>${x.role==='user'?`<button class="btn ghost" onclick="reset('${x.id}')">Reset to ₹10,00,000</button>`:''}</td></tr>`).join('') + '</table>';
    $('#all').innerHTML = t.length ? `<table><tr><th>Time</th><th>User</th><th>Side</th><th>Symbol</th><th>Qty</th><th>Price</th></tr>` +
      t.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(mail[x.user_id]||'')}</td><td>${x.side}</td><td>${esc(x.symbol)}</td><td>${x.qty}</td><td>${Number(x.price).toFixed(2)}</td></tr>`).join('') + '</table>'
      : '<div class="empty">No trades yet.</div>';
  }catch(err){ toast(err.message, true); }
}
async function marketEvent(){
  try{ const e = await api('/admin/event', {method:'POST', body:{}}); toast(`${e.eventType}: ${e.symbol} ${e.impactPct>0?'+':''}${e.impactPct.toFixed(1)}%`); }catch(err){ toast(err.message, true); }
}
async function simToggle(run){
  try{ const r = await api('/admin/simulation', {method:'POST', body:{run}}); toast(r.running?'Simulation running':'Simulation stopped'); adminView(); }catch(err){ toast(err.message, true); }
}
async function reset(id){
  if(!confirm('Reset this user’s cash to ₹10,00,000?')) return;
  try{ await api('/admin/reset', {method:'POST', body:{id}}); toast('Balance reset'); adminView(); }catch(err){ toast(err.message, true); }
}
render();
</script>
</body>
</html>
